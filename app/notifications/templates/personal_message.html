<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{page_title}}</title>
<style type="text/css">
  @media only screen and (max-width: 620px) {
    .oa-shell { padding:14px 10px !important; }
    .oa-pad { padding:20px 18px !important; }
    .oa-header { padding:16px 18px !important; }
    .oa-footer { padding:16px 18px !important; font-size:11.5px !important; }
    .oa-title { font-size:22px !important; }
    .oa-cta {
      display:block !important;
      width:100% !important;
      box-sizing:border-box !important;
      text-align:center !important;
      padding:15px !important;
      border-radius:26px !important;
      font-size:14.5px !important;
    }
    .oa-logo-box { width:26px !important; height:26px !important; border-radius:7px !important; }
    .oa-logo-img { width:18px !important; height:18px !important; }
    .oa-brand { font-size:13px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#f2f1ec;">
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">
    {{preheader}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f1ec;">
    <tr>
      <td align="center" class="oa-shell" style="padding:24px 14px;">

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:560px; background:#ffffff; border:1px solid #e4e6e1; border-radius:12px; overflow:hidden; font-size:15px; color:#132b26;">

          <!-- Header: brand logo on white tile -->
          <tr>
            <td class="oa-header" style="padding:22px 32px; border-bottom:1px solid #f2f1ec;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td valign="middle" style="padding-right:11px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" class="oa-logo-box" style="width:30px; height:30px; background:#ffffff; border:1px solid #e4e6e1; border-radius:8px;">
                      <tr>
                        <td align="center" valign="middle" style="width:30px; height:30px;">
                          <img
                            class="oa-logo-img"
                            src="{{logo_url}}"
                            width="22"
                            height="22"
                            alt="Orderly Affairs"
                            style="display:block; width:22px; height:22px; border:0; outline:none; text-decoration:none;"
                          />
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td valign="middle" class="oa-brand" style="font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:14px; font-weight:600; color:#132b26;">
                    Orderly Affairs
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td class="oa-pad" style="padding:32px;">
              <h1 class="oa-title" style="margin:0; font-family:'Instrument Serif',Georgia,'Times New Roman',serif; font-size:27px; font-weight:400; line-height:1.25; color:#132b26;">
                {{headline}}
              </h1>

              <p style="margin:16px 0 0 0; font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:15px; line-height:1.7; color:#3c4a46;">
                {{intro}}
              </p>

              {{media_or_letter_block}}

              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0; width:100%;">
                <tr>
                  <td style="padding:0;">
                    <a href="{{cta_url}}" class="oa-cta" style="display:inline-block; padding:14px 22px; border-radius:24px; background:#132b26; color:#ffffff; font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:14px; font-weight:500; text-decoration:none; line-height:1.2;">
                      {{cta_label}}
                    </a>
                  </td>
                </tr>
              </table>

              {{note_html}}
            </td>
          </tr>

          <!-- Footer strip -->
          <tr>
            <td class="oa-footer" style="padding:20px 32px; border-top:1px solid #f2f1ec; background:#f7f6f2; font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:12px; line-height:1.7; color:#8b9995;">
              {{footer_text}}
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
